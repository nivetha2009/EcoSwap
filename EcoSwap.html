{k:"donate",e:"🎁",t:"Donate it",w:c.n+(sc.donate===0?" Donations generally need items to be usable and safe.":""),d:"Easy",m:30,mt:"Cleaning supplies",st:dn?dn.s:["Check the item is clean, complete and safe","Ask the charity or group what they accept","Drop it off or arrange a pickup"],sf:dn?dn.sf:""},
{k:"sell",e:"🏷️",t:"Sell it",w:"EcoSwap has no pricing data, so it gives no price estimate. Use this checklist to find a fair range."+(sc.sell===0?" Items in this condition rarely sell well.":""),d:"Easy",m:40,mt:sl.mt.join(", "),st:sl.s,sf:sl.sf},
{k:"upcycle",e:"✨",t:"Upcycle it",w:up.length?"Projects in the library that suit this category:":"No upcycling project for this category in the library yet. Browse Explore Ideas for inspiration.",d:up[0]?.d||"Varies",m:up[0]?.m||0,mt:up[0]?.mt.join(", ")||"Depends on project",st:null,up,sf:""}];
A.forEach((a,i)=>{a.sc=sc[a.k];a.i=i});return A.sort((a,b)=>b.sc-a.sc||a.i-b.i)}
function results(){const A=recs(R);return `<section class="wrap"><a href="#/identify">← Identify another item</a><h2>Options for “${E(R.name)}”</h2><p class="mut">${E(R.cat)} · ${E(R.cond)}${R.note?" · Your notes: "+E(R.note):""}</p><p class="safe">These suggestions come from transparent rules based on category and condition, not AI. They are ordered by how well they fit that condition. Time figures are estimates.</p>
${IMG?`<img src="${IMG.u}" alt="Your photo" style="max-height:140px;border-radius:12px">`:""}<div class="stack">${A.map(a=>`<article class="card"><div class="rh"><h3>${a.e} ${a.t}</h3><span class="tag ${a.sc>=3?"g":a.sc===0?"w":""}">${a.sc>=3?"Best match":a.sc===0?"Less suitable":"Possible"}</span></div><p>${E(a.w)}</p>
<span class="tag">${a.d}</span><span class="tag">≈ ${a.m?tm(a.m)+" (estimate)":"time varies"}</span><p class="mut"><b>Materials:</b> ${E(a.mt)}</p>
${a.st?`<ol>${a.st.map(s=>`<li>${E(s)}</li>`).join("")}</ol>`:`<div class="row">${a.up.map(i=>`<button class="btn alt sm" data-act="idea" data-id="${i.id}">${i.e} ${E(i.t)}</button>`).join("")}</div>`}
${a.sf?`<p class="safe">⚠ ${E(a.sf)}</p>`:""}<button class="btn sm" data-act="plan" data-ty="${a.k}" data-l="${E(a.t.replace(" it","")+": "+R.name)}">Add to my plan</button></article>`).join("")}</div></section>`}
function filt(){return I.filter(i=>(!F.c||i.c===F.c)&&(!F.o||i.o===F.o)&&(!F.d||i.d===F.d)&&(!F.$||i.$===F.$)&&(!F.t||(F.t==="a"?i.m<=30:F.t==="b"?i.m>30&&i.m<=60:i.m>60))).sort((a,b)=>F.s==="t"?a.t.localeCompare(b.t):F.s==="m"?a.m-b.m:["Easy","Medium","Hard"].indexOf(a.d)-["Easy","Medium","Hard"].indexOf(b.d))}
function grid(){const r=filt();$("#ig").innerHTML=r.length?r.map(icard).join(""):'<p class="card">No ideas match these filters. Try clearing one.</p>';$("#ic").textContent=r.length+" of "+I.length+" ideas"}
function explore(){return `<section class="wrap"><h2>Explore ideas</h2><div class="filters">
<label>Material / category<select data-f="c">${opts(K,F.c,"All")}</select></label><label>Outcome<select data-f="o">${opts(["reuse","repair","recycle","donate","sell","upcycle"],F.o,"All")}</select></label><label>Difficulty<select data-f="d">${opts(["Easy","Medium","Hard"],F.d,"All")}</select></label><label>Cost<select data-f="$">${opts(["Free","Low","Medium"],F.$,"All")}</select></label>
<label>Time<select data-f="t"><option value="">Any</option><option value="a"${F.t==="a"?" selected":""}>30 min or less</option><option value="b"${F.t==="b"?" selected":""}>31–60 min</option><option value="c"${F.t==="c"?" selected":""}>Over 1 hour</option></select></label>
<label>Sort by<select data-f="s"><option value="t">Title</option><option value="m"${F.s==="m"?" selected":""}>Quickest</option><option value="d"${F.s==="d"?" selected":""}>Easiest</option></select></label><button class="btn alt sm" data-act="clr">Clear</button></div><p class="mut" id="ic" aria-live="polite"></p><div class="grid" id="ig"></div></section>`}
function ideaM(id){const i=I.find(x=>x.id==id),sv=S.sv.includes(i.id);M(`<div class="ic">${i.e}</div><h2>${E(i.t)}</h2>${chips(i)}<p>${E(i.x)}</p><h3>Materials</h3><ul>${i.mt.map(m=>`<li>${E(m)}</li>`).join("")}</ul><h3>Instructions</h3><ol>${i.s.map(s=>`<li>${E(s)}</li>`).join("")}</ol><p class="safe">⚠ ${E(i.sf)}</p><p class="mut">Time and cost are rough estimates.</p><div class="row"><button class="btn" data-act="save" data-id="${i.id}">${sv?"Unsave":"Save idea"}</button><button class="btn alt" data-act="plan" data-ty="${i.o}" data-l="${E(i.t)}">Add to my plan</button></div>`)}
function lfilt(){return [...S.ls,...L].filter(l=>(!CF.ty||l.ty===CF.ty)&&(!CF.c||l.c===CF.c))}
function lgrid(){const r=lfilt();$("#lg").innerHTML=r.length?r.map(l=>`<button class="card idea" data-act="lst" data-id="${l.id}"><span class="tag ${l.sample?"":"g"}">${l.sample?"Sample listing":"Your local demo"}</span><h3>${E(l.t)}</h3><span class="tag g">${l.ty}</span><span class="tag">${E(l.c)}</span><span class="tag">${E(l.cd)}</span><p class="mut">${E(l.loc)}</p>${S.sl.includes(l.id)?'<span class="tag w">Saved</span>':""}</button>`).join(""):'<p class="card">No listings match. Try another filter or create a demo listing.</p>'}
L.forEach(l=>l.sample=1);
function community(){return `<section class="wrap"><h2>Community and item exchange</h2><p class="safe">Prototype: all listings below are clearly labelled samples, not real people or offers. There are no payments or messaging. A real marketplace needs sign-in, moderation and a secure database.</p><div class="filters"><label>Type<select data-cf="ty">${opts(["Sell","Donate","Exchange"],CF.ty,"All")}</select></label><label>Category<select data-cf="c">${opts(K,CF.c,"All")}</select></label></div><div class="grid" id="lg"></div>
<div class="sec"><h2>Create a demo listing</h2><form id="fl" class="card form" novalidate><label>Title<input id="lt" maxlength="60"></label><label>Type<select id="ly">${opts(["Sell","Donate","Exchange"],"")}</select></label><label>Category<select id="lc">${opts(K,"")}</select></label><label>Condition<select id="lk">${opts(Object.keys(SC),"Good")}</select></label><label>General area only (no addresses)<input id="ll" maxlength="40"></label><label>Description<textarea id="ld" maxlength="200" rows="2"></textarea></label><p class="err" id="le" role="alert"></p><button class="btn">Save demo listing</button><small>Saved only in this browser. It isn’t published anywhere.</small></form></div></section>`}
function lstM(id){const l=[...S.ls,...L].find(x=>x.id==id);M(`<span class="tag ${l.sample?"":"g"}">${l.sample?"Sample listing, not a real offer":"Your local demo listing"}</span><h2>${E(l.t)}</h2><span class="tag g">${l.ty}</span><span class="tag">${E(l.c)}</span><span class="tag">${E(l.cd)}</span><p>${E(l.d||"No description.")}</p><p class="mut">Area: ${E(l.loc)}. Contacting or paying other users isn’t available in this prototype.</p><div class="row"><button class="btn" data-act="lsave" data-id="${l.id}">${S.sl.includes(l.id)?"Unsave":"Save listing"}</button>${l.sample?"":`<button class="btn alt" data-act="ldel" data-id="${l.id}">Delete</button>`}</div>`)}
function journey(){const D=S.ac.filter(a=>a.done),n=t=>D.filter(a=>a.ty===t).length,p=Math.min(100,Math.round(D.length/S.goal*100));
return `<section class="wrap"><h2>My eco journey</h2><p class="mut">Stored only in this browser. It may not sync between devices and is lost if you clear site data.</p>
<div class="grid">${[["Items explored",S.ex.length],["Reused",n("reuse")],["Repaired",n("repair")],["Donated",n("donate")],["Recycled",n("recycle")],["Sold",n("sell")],["Upcycle projects done",n("upcycle")],["Saved ideas",S.sv.length]].map(s=>`<div class="card stat"><b>${s[1]}</b>${s[0]}</div>`).join("")}</div>
<div class="sec card"><h3>Goal: ${D.length} of ${S.goal} confirmed actions</h3><div class="bar" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%"></i></div><label style="margin-top:.8rem;max-width:220px">Your goal<input id="gl" type="number" min="1" max="100" value="${S.goal}"></label></div>
<div class="sec"><h2>Activities</h2>${S.ac.length?[...S.ac].reverse().map(a=>`<div class="act"><span>${a.done?"✅":"🕒"} ${E(a.l)}<br><small>${a.done?"Completed "+dt(a.dt):"Planned "+dt(a.at)}</small></span><span>${a.done?`<button class="btn alt sm" data-act="undo" data-id="${a.id}">Undo</button>`:`<button class="btn sm" data-act="done" data-id="${a.id}">Mark completed</button>`} <button class="btn alt sm" data-act="rm" data-id="${a.id}">Remove</button></span></div>`).join(""):'<p class="card">No activities yet. <a href="#/identify">Identify an item</a> and add an option to your plan.</p>'}</div>
<div class="sec"><h2>Saved ideas</h2>${S.sv.length?`<div class="grid">${I.filter(i=>S.sv.includes(i.id)).map(icard).join("")}</div>`:'<p class="card">Nothing saved yet. <a href="#/explore">Explore ideas</a>.</p>'}</div>
<div class="sec"><h2>Saved listings</h2>${S.sl.length?[...S.ls,...L].filter(l=>S.sl.includes(l.id)).map(l=>`<div class="act"><span>${E(l.t)} <small>(${l.sample?"sample":"local demo"})</small></span><button class="btn alt sm" data-act="lst" data-id="${l.id}">Open</button></div>`).join(""):'<p class="card">No saved listings.</p>'}</div>
<div class="sec"><h3>Recently explored</h3>${S.ex.slice(-5).reverse().map(x=>`<p class="mut">${E(x.n)} · ${E(x.c)} · ${dt(x.at)}</p>`).join("")||'<p class="mut">Nothing yet.</p>'}<button class="btn alt sm" data-act="reset">Erase all my data</button></div></section>`}
function about(){return `<section class="wrap" style="max-width:720px"><h2>About EcoSwap</h2><p>EcoSwap helps you decide what to do with things you no longer need: reuse, repair, recycle, donate, sell or upcycle.</p><h3>How recommendations work</h3><p>A readable set of rules uses the category and condition you choose. There is no AI and no photo analysis. Photos never leave your device.</p><h3>Your data</h3><p>Everything is saved in this browser’s local storage and is not sent anywhere.</p><h3>Before a public launch</h3><ul><li>A backend with sign-in, moderation and secure storage for the community marketplace.</li><li>A server-side endpoint for any AI image recognition, so no API keys ever sit in the page (see the <code>recognise</code> hook in the code).</li><li>Local recycling data per region, since acceptance rules vary.</li><li>Security review: content-security policy, rate limiting, privacy policy.</li><li>Accessibility audit with real assistive technology.</li></ul></section>`}
const V={home,identify,results,explore,community,journey,about};
function render(){let v=(location.hash.slice(2)||"home").split("?")[0];if(!V[v])v="home";if(v==="results"&&!R){location.hash="#/identify";return}$("#app").innerHTML=V[v]();document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.r===v||(v==="results"&&a.dataset.r==="identify")));$("nav").classList.remove("open");scrollTo(0,0);if(v==="explore")grid();if(v==="community")lgrid();if(v==="identify"&&IMG)showImg()}
function submit(n,c,cd,note){R={name:n,cat:c,cond:cd,note};S.ex.push({n,c,at:new Date().toISOString()});save();location.hash="#/results"}
const uid=()=>Date.now()+Math.random().toString(36).slice(2,6);
function stay(){const v=location.hash.slice(2);const s=scrollY;render();scrollTo(0,s)}
document.addEventListener("click",e=>{if(e.target.classList.contains("bk"))return closeM();const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,id=b.dataset.id,v=location.hash.slice(2);
if(a==="nav")$("nav").classList.toggle("open");
else if(a==="close")closeM();
else if(a==="idea")ideaM(id);
else if(a==="lst")lstM(id);
else if(a==="save"){const i=+id,x=S.sv.indexOf(i);x<0?S.sv.push(i):S.sv.splice(x,1);save();toast(x<0?"Idea saved":"Idea removed from saved");ideaM(i);if(v==="explore")grid();else if(v==="journey")stay()}
else if(a==="lsave"){const x=S.sl.indexOf(id);x<0?S.sl.push(id):S.sl.splice(x,1);save();toast(x<0?"Listing saved":"Listing unsaved");lstM(id);if(v==="community")lgrid();else if(v==="journey")stay()}
else if(a==="ldel"){S.ls=S.ls.filter(l=>l.id!=id);S.sl=S.sl.filter(x=>x!=id);save();closeM();lgrid();toast("Demo listing deleted")}
else if(a==="plan"){S.ac.push({id:uid(),ty:b.dataset.ty,l:b.dataset.l,at:new Date().toISOString(),done:false});save();closeM();toast("Added to your plan. Confirm it in My Eco Journey when done.")}
else if(a==="done"||a==="undo"){const x=S.ac.find(q=>q.id==id);x.done=a==="done";x.dt=x.done?new Date().toISOString():null;save();stay()}
else if(a==="rm"){S.ac=S.ac.filter(q=>q.id!=id);save();stay()}
else if(a==="try"){submit(b.dataset.n,b.dataset.c,b.dataset.cd,"")}
else if(a==="rmimg"){URL.revokeObjectURL(IMG.u);IMG=null;$("#im").value="";showImg()}
else if(a==="clr"){F={c:"",o:"",d:"",$:"",t:"",s:"t"};render()}
else if(a==="reset"){if(!rst){rst=1;b.textContent="Click again to erase everything";setTimeout(()=>{rst=0;if(b.isConnected)b.textContent="Erase all my data"},4000)}else{S={ex:[],ac:[],sv:[],sl:[],ls:[],goal:5};save();rst=0;render();toast("All local data erased")}}});
document.addEventListener("change",e=>{const t=e.target;if(t.id==="im")pick(t.files[0]);else if(t.dataset.f){F[t.dataset.f]=t.value;grid()}else if(t.dataset.cf){CF[t.dataset.cf]=t.value;lgrid()}else if(t.id==="nm"&&ITEMS[t.value])$("#ct").value=ITEMS[t.value];else if(t.id==="gl"){const n=Math.max(1,Math.min(100,+t.value||5));S.goal=n;save();stay()}});
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target.id;
if(f==="fi"){const n=$("#nm").value.trim(),c=$("#ct").value;if(n.length<2){$("#fe").textContent="Enter the item’s name (at least 2 characters).";return}if(!c){$("#fe").textContent="Choose a category.";return}submit(n,c,$("#cd").value,$("#dt").value.trim())}
if(f==="fl"){const t=$("#lt").value.trim(),c=$("#lc").value,l=$("#ll").value.trim();if(t.length<3||!c||!l){$("#le").textContent="Add a title (3+ characters), a category and a general area.";return}S.ls.unshift({id:"u"+uid(),t,ty:$("#ly").value,c,cd:$("#lk").value,loc:l,d:$("#ld").value.trim()});save();e.target.reset();$("#le").textContent="";lgrid();toast("Demo listing saved in this browser")}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeM()});
addEventListener("hashchange",render);render();
</script></body></html>
